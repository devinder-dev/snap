services:
  postgres:
    image: postgres:17
    container_name: snap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: snap
    ports:
      - "5432:5432"
    volumes:
      - .:/volume
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d snap"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
