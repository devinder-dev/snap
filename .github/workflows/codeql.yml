# CodeQL (SCALING-PLAN.md Step 9): GitHub reads the code for dangerous
# patterns — injection, unsafe paths, secrets in logs — and lists what it finds
# under the repository's Security tab. Free for public repositories.
#
#   javascript-typescript   the backend and the app
#   actions                 the workflows themselves (e.g. untrusted input in a run: line)

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly as well: new checks arrive even when the code doesn't change.
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No build step: CodeQL reads TypeScript and workflow files as they are.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
