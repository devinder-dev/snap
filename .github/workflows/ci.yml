# CI/CD for Snap. On every push, to any branch:
#
#   checks   no secrets committed; the backend and the app typecheck; unit tests
#   stack    both images built; the whole stack started in compose (3 api copies,
#            the worker, Traefik, S3Mock); the e2e run twice — across two named
#            copies, and through Traefik
#   publish  main only, after both passed: the images pushed to ghcr.io, tagged
#            with the commit SHA, for amd64 and arm64
#
# Every action is pinned to a full commit SHA (the comment names the version):
# a tag like @v7 can be moved to different code, a SHA can't. Dependabot
# keeps the SHAs up to date.

name: CI

on:
  push:
  workflow_dispatch:

# Read-only unless a job asks for more (only publish does).
permissions:
  contents: read

# A newer push to the same branch cancels the run still going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4

jobs:
  checks:
    name: Secrets and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Step 1: Nothing secret in git. GitHub's push protection blocks known
      # key formats on push; this also catches a committed .env file.
      - name: No secrets committed
        run: |
          if git ls-files | grep -E '(^|/)\.env' | grep -vE '(^|/)\.env\.example$'; then
            echo "::error::An .env file is committed. Remove it from git and replace every key it held."
            exit 1
          fi
          if git grep -nE 'AKIA[0-9A-Z]{16}'; then
            echo "::error::An AWS access key ID is committed. Deactivate the key in AWS first, then remove it."
            exit 1
          fi
          echo "No .env files and no AWS key IDs in the repository."

      # Step 2: Both TypeScript projects compile.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Typecheck the backend
        working-directory: backend
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit -p .

      # Unit tests (*.test.ts): moments the e2e can't create on demand, such
      # as a RabbitMQ error in the middle of a connection's setup.
      - name: Unit tests
        working-directory: backend
        run: bun test

      - name: Typecheck the app
        working-directory: snap
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit

  stack:
    name: Whole stack + e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_FILE: docker-compose.yml:compose.stack.yml:compose.ci.yml
      # Only set where the secret exists, so the login below can be skipped.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Logged-in pulls get a higher Docker Hub limit than anonymous ones.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Step 1: Build both images into the runner's Docker, with the layer
      # cache kept between runs.
      - name: Build the app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: app
          tags: snap-app:local
          load: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build the tools image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: tools
          tags: snap-tools:local
          load: true
          cache-from: type=gha,scope=tools
          cache-to: type=gha,scope=tools,mode=max

      # Step 2: Start the stack and wait for 3 healthy api copies.
      - name: Start the stack
        run: |
          docker compose up -d --no-build
          for _ in $(seq 1 90); do
            healthy=$(docker compose ps api --format '{{.Health}}' | grep -cx healthy || true)
            [ "$healthy" = 3 ] && { echo "3 api copies healthy"; docker compose ps; exit 0; }
            sleep 2
          done
          echo "::error::The api copies did not all become healthy"
          docker compose ps -a
          exit 1

      # Step 3: The e2e, twice. Across two copies by name (Anna on api-1, Ben
      # on api-2, so every push must cross RabbitMQ), then through Traefik.
      - name: e2e across two copies
        run: docker compose run --rm e2e

      - name: e2e through Traefik
        run: docker compose run --rm -e E2E_BASE_URL=http://traefik -e E2E_OTHER_URL=http://traefik e2e

      - name: Logs of the stack
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publish the images
    needs: [checks, stack]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      matrix:
        target: [app, tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # GITHUB_TOKEN is enough for ghcr.io; it lives only for this run.
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU lets this amd64 machine build the arm64 image too.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The tag is the full commit SHA — never "latest", so a deploy names
      # exactly the code it runs. The labels link the image to this repo.
      - name: Image name, tag and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/snap-${{ matrix.target }}
          tags: type=sha,format=long,prefix=

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish-${{ matrix.target }}
          cache-to: type=gha,scope=publish-${{ matrix.target }},mode=max
