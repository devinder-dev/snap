# The whole backend in containers, on the laptop:
# Traefik in front of 3 api copies, the worker, and the migrations before them.
# Layered on top of docker-compose.yml, which keeps Postgres and RabbitMQ:
#
#   docker compose -f docker-compose.yml -f compose.stack.yml up -d --build
#
# or once per terminal:  export COMPOSE_FILE=docker-compose.yml:compose.stack.yml
#
#   http://localhost:8080          the api, through Traefik (phone: <your LAN IP>:8080)
#   http://localhost:8081          Traefik's dashboard
#   docker compose run --rm sweep  the safety net, once
#   docker compose run --rm e2e    the e2e, Anna on snap-api-1 and Ben on snap-api-2

# What every backend container shares: backend/.env (S3 and JWT settings),
# except that Postgres and RabbitMQ are reached by their service names here.
# These are the local-only passwords already set in docker-compose.yml.
#
# The .env file is optional because CI has none: compose.ci.yml sets those
# values instead. On the laptop a missing .env still fails loudly — the api
# stops at startup with "Set S3_BUCKET!".
x-backend: &backend
  env_file:
    - path: backend/.env
      required: false
  environment:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/snap
    RABBITMQ_URL: amqp://snap:snap@rabbitmq:5672
    # Traefik is the one proxy in front of the api: believe its
    # X-Forwarded-For entry, and only that one (backend/src/config.ts).
    TRUST_PROXY_HOPS: "1"

# One image for the api, the worker and the sweep (backend/Dockerfile).
x-app-image: &app-image
  image: snap-app:local
  build:
    context: backend
    target: app

# The same Dockerfile's tools target: migrations and the e2e.
x-tools-image: &tools-image
  image: snap-tools:local
  build:
    context: backend
    target: tools

services:
  traefik:
    image: traefik:v3.7.19
    restart: unless-stopped
    ports:
      # All interfaces, so a phone on the same Wi-Fi can reach it.
      - "8080:80"
      # The dashboard: this laptop only.
      - "127.0.0.1:8081:8080"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # Read-only, but still powerful: whoever reads the Docker socket can
      # see every container. Fine on the laptop; revisited at Step 11.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true

  # Runs the migrations once and exits. Everything that needs the database
  # starts only after it has finished successfully.
  migrate:
    <<: [*backend, *tools-image]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: [*backend, *app-image]
    deploy:
      replicas: 3
    restart: unless-stopped
    # No published port: only Traefik is reachable from outside.
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    # "Is this process up" — /health never touches Postgres or RabbitMQ: if
    # it did, one database blip would mark every copy unhealthy at once, and
    # Traefik would have nowhere to send traffic. The image has no curl, so
    # Bun makes the request.
    healthcheck:
      test: ["CMD", "/usr/local/bin/bun", "-e", "const r = await fetch('http://localhost:3000/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
      start_interval: 1s
    # Traefik sends traffic only to labelled containers, and only while
    # they're healthy. The 3 copies share these labels, so they become one
    # service with 3 servers.
    labels:
      - traefik.enable=true
      - traefik.http.routers.snap.rule=PathPrefix(`/`)
      - traefik.http.routers.snap.entrypoints=web
      - traefik.http.services.snap.loadbalancer.server.port=3000
      # The network Traefik reaches the copies on: <project>_default, so the
      # stack also works under another project name (a CI rehearsal).
      - traefik.docker.network=${COMPOSE_PROJECT_NAME:-snap}_default

  worker:
    <<: [*backend, *app-image]
    command: ["/usr/local/bin/bun", "--sql-preconnect", "src/worker.ts"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # On demand only (the "tools" profile): `docker compose run --rm sweep`.
  sweep:
    <<: [*backend, *app-image]
    profiles: [tools]
    command: ["/usr/local/bin/bun", "scripts/sweep.ts"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # On demand only: `docker compose run --rm e2e`. Talks to two copies by
  # name, so every push between Anna and Ben has to cross RabbitMQ. The names
  # are <project>-api-<n>: snap-api-1 normally.
  e2e:
    <<: [*backend, *tools-image]
    profiles: [tools]
    command: ["bun", "scripts/e2e.ts"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/snap
      RABBITMQ_URL: amqp://snap:snap@rabbitmq:5672
      E2E_BASE_URL: http://${COMPOSE_PROJECT_NAME:-snap}-api-1:3000
      E2E_OTHER_URL: http://${COMPOSE_PROJECT_NAME:-snap}-api-2:3000
    depends_on:
      api:
        condition: service_healthy
