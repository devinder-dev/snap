# Standalone production stack. The shared edge stack owns public ports.
name: snap-prod

x-database: &database
  DATABASE_URL: "postgresql://snap:${SNAP_POSTGRES_PASSWORD:?Set SNAP_POSTGRES_PASSWORD}@postgres:5432/snap"

x-storage: &storage
  S3_ENDPOINT: "${S3_ENDPOINT:?Set S3_ENDPOINT}"
  S3_REGION: "${S3_REGION:?Set S3_REGION}"
  S3_BUCKET: "${S3_BUCKET:?Set S3_BUCKET}"
  S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}"
  S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}"

x-runtime: &runtime
  image: "ghcr.io/devinder-dev/snap-app:${SNAP_SHA:?Set SNAP_SHA to a published 40-character commit SHA}"

x-tools: &tools
  image: "ghcr.io/devinder-dev/snap-tools:${SNAP_SHA:?Set SNAP_SHA to a published 40-character commit SHA}"

x-backend: &backend
  <<: [*database, *storage]
  RABBITMQ_URL: "amqp://snap:${SNAP_RABBITMQ_PASSWORD:?Set SNAP_RABBITMQ_PASSWORD}@rabbitmq:5672"

x-start-after: &start-after
  migrate:
    condition: service_completed_successfully
  rabbitmq:
    condition: service_healthy

services:
  postgres:
    image: postgres:17.12
    restart: unless-stopped
    mem_limit: 640m # Shared buffers, query work, and the OS page cache.
    environment:
      POSTGRES_USER: snap
      POSTGRES_PASSWORD: "${SNAP_POSTGRES_PASSWORD:?Set SNAP_POSTGRES_PASSWORD}"
      POSTGRES_DB: snap
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "snap", "-d", "snap"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.4.1-management
    hostname: rabbitmq
    restart: unless-stopped
    mem_limit: 768m # Room for the Erlang VM and queued timers above the alarm.
    environment:
      RABBITMQ_DEFAULT_USER: snap
      RABBITMQ_DEFAULT_PASS: "${SNAP_RABBITMQ_PASSWORD:?Set SNAP_RABBITMQ_PASSWORD}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/production.conf:/etc/rabbitmq/conf.d/99-snap.conf:ro
    networks: [private]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrate:
    <<: *tools
    restart: "no"
    mem_limit: 192m # Bun and dbmate run once, before API startup.
    environment: *database
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *runtime
    restart: unless-stopped
    stop_grace_period: 330s
    deploy:
      replicas: 3
    mem_limit: 256m # Per copy, with room for Bun and buffered photo uploads.
    environment:
      <<: *backend
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}"
      SNAP_REGISTRATION_CODE: "${SNAP_REGISTRATION_CODE:?Set SNAP_REGISTRATION_CODE}"
      TRUST_PROXY_HOPS: "1"
      SNAP_TRAFFIC_DRAIN: "1"
    depends_on: *start-after
    networks: [edge, private]
    healthcheck:
      test: ["CMD", "/usr/local/bin/bun", "-e", "const r = await fetch('http://localhost:3000/health/traffic'); process.exit(r.ok ? 0 : 1)"]
      interval: 2s
      timeout: 2s
      retries: 2
      start_period: 15s
      start_interval: 1s
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.snap-api.rule: "Host(`${SNAP_HOST:?Set SNAP_HOST}`)"
      traefik.http.routers.snap-api.entrypoints: websecure
      traefik.http.routers.snap-api.service: snap-api
      traefik.http.services.snap-api.loadbalancer.server.port: "3000"

  worker:
    <<: *runtime
    restart: unless-stopped
    mem_limit: 256m # Bun, database pool, and at most ten in-flight jobs.
    command: ["/usr/local/bin/bun", "--sql-preconnect", "src/worker.ts"]
    environment: *backend
    depends_on: *start-after
    networks: [private, outbound]

  sweep:
    <<: *runtime
    profiles: [tools]
    restart: "no"
    mem_limit: 256m # A bounded batch of S3 deletions.
    command: ["/usr/local/bin/bun", "scripts/sweep.ts"]
    environment: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private, outbound]

  seed-demo:
    <<: *tools
    profiles: [tools]
    restart: "no"
    mem_limit: 192m # One transaction and three bcrypt hashes.
    command: ["bun", "run", "seed:demo"]
    environment:
      <<: *database
      SNAP_DEMO_PASSWORD: "${SNAP_DEMO_PASSWORD:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]

  e2e:
    <<: *tools
    profiles: [tools]
    restart: "no"
    mem_limit: 256m # One test process with HTTP, WebSockets, and photo fixtures.
    command: ["bun", "scripts/e2e.ts"]
    environment:
      <<: *backend
      SNAP_REGISTRATION_CODE: "${SNAP_REGISTRATION_CODE:?Set SNAP_REGISTRATION_CODE}"
      E2E_BASE_URL: "https://${SNAP_HOST:?Set SNAP_HOST}"
      E2E_OTHER_URL: "https://${SNAP_HOST:?Set SNAP_HOST}"
    # Reach the host's published edge port even without public DNS or NAT loopback.
    extra_hosts:
      - "${SNAP_HOST:?Set SNAP_HOST}:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    networks: [private, outbound]

networks:
  edge:
    external: true
    name: edge
  private:
    internal: true
  outbound: {}

volumes:
  postgres-data:
  rabbitmq-data:
